spring:
  config:
    # Spring Boot does not load .env automatically. The extension makes KEY=value entries properties.
    import: optional:file:.env[.properties]
  application:
    name: home-davi
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME:home_davi}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      minimum-idle: ${DATABASE_POOL_MIN_IDLE:2}
  jpa:
    open-in-view: false
    hibernate:
      # O schema é gerenciado pelos scripts em deploy/postgres; o Hibernate só confere o mapeamento.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  ai:
    mcp:
      server:
        name: home-davi-mcp
        version: 0.0.1
        # O Copilot CLI usa Streamable HTTP: JSON-RPC por POST /mcp.
        protocol: STREAMABLE
        instructions: "Ferramentas de consulta do Home Davi."
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info
pluggy:
  webhook:
    secret: ${PLUGGY_WEBHOOK_SECRET}
  api:
    base-url: ${PLUGGY_API_URL:https://api.pluggy.ai}
    client-id: ${PLUGGY_CLIENT_ID}
    client-secret: ${PLUGGY_CLIENT_SECRET}
hermes:
  webhook:
    # Enquanto false, os resumos continuam seguros na outbox e nenhum dado sai da aplicação.
    enabled: ${HERMES_WEBHOOK_ENABLED:false}
    url: ${HERMES_WEBHOOK_URL:}
    secret: ${HERMES_WEBHOOK_SECRET:}
    poll-delay: ${HERMES_OUTBOX_POLL_DELAY:PT5S}
    batch-size: ${HERMES_OUTBOX_BATCH_SIZE:20}
security:
  mcp-auth:
    # Sem token configurado, o endpoint MCP responde 503 (fail closed).
    token: ${MCP_AUTH_TOKEN:}
  # Allowlist de IPs válida para TODAS as requisições. O loopback (127.0.0.1/::1) é sempre liberado.
  ip-allowlist:
    enabled: ${IP_ALLOWLIST_ENABLED:true}
    # Só ligue se houver um proxy reverso confiável à frente; X-Forwarded-For é falsificável.
    trust-forwarded-for: ${IP_ALLOWLIST_TRUST_XFF:false}
    # IPs/CIDRs separados por vírgula; definidos no .env (IP_ALLOWLIST_ENTRIES). CIDR ex.: 192.168.2.0/24
    # O cloudflared instalado no host chega ao container pelo gateway da bridge Docker.
    entries: ${IP_ALLOWLIST_ENTRIES:52.67.145.81,192.168.2.165,192.168.2.185}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    capacity: ${RATE_LIMIT_CAPACITY:100}   # requisições por IP por janela
    window: ${RATE_LIMIT_WINDOW:PT1M}      # janela (ISO-8601); PT1M = 1 minuto
